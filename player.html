<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">
</head>

<body class="player-page-body">
    <nav class="player-topbar">
        <div class="left-half">
            <a href="index.html" class="logo player-logo" aria-label="Go to home"><i
                    class="fa-brands fa-spotify"></i></a>
            <button id="backHomeBtn" class="page-back-btn" type="button">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Home</span>
            </button>
        </div>

        <form id="playerSearchForm" class="player-search-form">
            <div class="search-bar player-search-bar">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="playerSearchInput" class="input-box player-search-input"
                    placeholder="Search any song..." />
                <button class="player-search-submit" type="submit">Play</button>
            </div>
        </form>
    </nav>

    <main class="player-page-shell">
        <section class="player-stage">
            <div class="player-stage-card">
                <div class="player-cover-panel">
                    <img id="playerCover" class="player-cover" src="" alt="Album art" />
                    <div class="player-glow"></div>
                </div>

                <div class="player-meta-panel">
                    <p id="playerSourceLabel" class="player-kicker">Now Playing</p>
                    <h1 id="playerSongTitle" class="player-song-title">Loading song...</h1>
                    <p id="playerSongArtist" class="player-song-artist">Artist info</p>
                    <p id="playerSongAlbum" class="player-song-album">Album info</p>

                    <div class="player-cta-row">
                        <button id="heroHomeBtn" class="hero-secondary-btn" type="button">
                            <i class="fa-solid fa-house"></i>
                            <span>Home</span>
                        </button>
                        <span id="playerStatus" class="player-status-pill">Preparing player...</span>
                    </div>

                    <div class="player-controls-card">
                        <div class="player-main-controls">
                            <button id="playerShuffle" class="player-circle-btn" type="button" aria-label="Shuffle">
                                <i class="player-btns fa-solid fa-shuffle"></i>
                            </button>
                            <button id="playerPrev" class="player-circle-btn" type="button" aria-label="Previous song">
                                <i class="player-btns fa-solid fa-backward-step"></i>
                            </button>
                            <button id="playerToggle" class="player-circle-btn player-circle-btn--primary" type="button"
                                aria-label="Play or pause">
                                <i class="player-btns fa-solid fa-circle-play"></i>
                            </button>
                            <button id="playerNext" class="player-circle-btn" type="button" aria-label="Next song">
                                <i class="player-btns fa-solid fa-forward-step"></i>
                            </button>
                            <button id="playerRepeat" class="player-circle-btn" type="button" aria-label="Repeat">
                                <i class="player-btns fa-solid fa-repeat"></i>
                            </button>
                        </div>

                        <div class="player-progress-block">
                            <span id="playerCurrentTime" class="time-display">0:00</span>
                            <input type="range" id="playerProgress" value="0" min="0" max="100" />
                            <span id="playerTotalTime" class="time-display">0:00</span>
                        </div>

                        <div class="player-volume-row">
                            <i id="playerVolumeIcon" class="fa-solid fa-volume-high volume-icon"></i>
                            <input type="range" id="playerVolume" value="70" min="0" max="100" class="volume-slider" />
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="player-queue-panel">
            <div class="player-queue-header">
                <div>
                    <p class="player-kicker">Search Queue</p>
                    <h2>Selected Songs</h2>
                </div>
                <span id="queueCount" class="queue-count">0 songs</span>
            </div>
            <div id="playerQueue" class="player-queue-list"></div>
        </aside>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="animations.js"></script>
    <script src="player.js"></script>
</body>

</html>
